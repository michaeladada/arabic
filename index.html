<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn the Arabic Alphabet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f0;
    --card: #ffffff;
    --ink: #2d2a32;
    --muted: #7a7480;
    --accent: #7c4dff;
    --good: #2ecc71;
    --bad: #ff5c5c;
    --radius: 18px;
    --palette-1: #ff4f9a;
    --palette-2: #3d8bff;
    --palette-3: #ff9f1c;
    --palette-4: #9b5de5;
    --palette-5: #00b894;
    --palette-6: #e84118;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Nunito", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 760px;
    padding: 20px 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 1.4rem; margin: 0; }
  header h1 span { font-family: "Noto Naskh Arabic", serif; color: var(--accent); }
  main { width: 100%; max-width: 760px; padding: 16px; }
  .hidden { display: none !important; }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    font-weight: 700;
  }
  .btn.secondary { background: #ece7f7; color: var(--ink); }
  .btn:focus-visible, .option:focus-visible, .game-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Menu ---------- */
  .menu h2 { text-align: center; margin: 8px 0 20px; }
  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .game-card {
    background: var(--card);
    border: 3px solid #eee;
    border-radius: var(--radius);
    padding: 24px 18px;
    text-align: center;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .game-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(124,77,255,.15); }
  .game-card .demo { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 1.1rem; color: var(--muted); }
  .game-card .demo .ar { font-family: "Noto Naskh Arabic", serif; font-size: 3rem; color: var(--palette-2); line-height: 1.4; }
  .game-card .demo .en { font-size: 1.6rem; font-weight: 800; color: var(--palette-1); }
  .game-card h3 { margin: 10px 0 4px; font-size: 1.2rem; }
  .game-card p { margin: 0; color: var(--muted); font-size: .95rem; }

  .settings {
    margin-top: 24px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    border: 2px solid #eee;
  }
  .settings h3 { margin: 0 0 10px; font-size: 1rem; }
  .forms { display: flex; flex-wrap: wrap; gap: 10px; }
  .forms label {
    display: flex; align-items: center; gap: 6px;
    background: #f6f3fb; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  }
  .settings .hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; }

  /* ---------- Game ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stats { display: flex; gap: 14px; font-weight: 700; }
  .stats .pill { background: var(--card); border: 2px solid #eee; padding: 6px 12px; border-radius: 999px; }
  .progress { height: 8px; background: #eee; border-radius: 99px; margin: 14px 0; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  .prompt-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 3px solid #eee;
    padding: 18px;
    text-align: center;
    position: relative;
  }
  .form-tag {
    display: inline-block;
    font-size: .8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f1ecff;
    color: var(--accent);
  }
  .prompt-ar {
    font-family: "Noto Naskh Arabic", serif;
    font-size: clamp(6rem, 22vw, 10rem);
    line-height: 1.5;
    margin: 0;
  }
  .prompt-en { font-size: clamp(3rem, 12vw, 5rem); font-weight: 800; margin: 24px 0; }
  .prompt-sub { color: var(--muted); font-size: .9rem; min-height: 1.2em; }
  .speak {
    position: absolute; top: 12px; right: 12px;
    background: #f6f3fb; width: 42px; height: 42px; font-size: 1.2rem;
  }

  .options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  .option {
    background: var(--card);
    border: 3px solid #e6e1ee;
    padding: 14px 10px;
    font-size: 1.5rem;
    font-weight: 800;
    position: relative;
    transition: transform .1s, border-color .15s, background .15s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
  .option.ar { font-family: "Noto Naskh Arabic", serif; font-size: 3.4rem; font-weight: 700; line-height: 1.5; padding: 0 10px; }
  .option .key {
    position: absolute; top: 6px; left: 10px;
    font-family: "Nunito", sans-serif; font-size: .75rem; color: #bbb; font-weight: 700;
  }
  .option.correct { background: #e7f9ef; border-color: var(--good); }
  .option.wrong { background: #ffecec; border-color: var(--bad); animation: shake .35s; }
  .option:disabled { cursor: default; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .feedback {
    margin-top: 16px;
    background: var(--card);
    border-radius: var(--radius);
    border: 2px solid #eee;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .feedback .msg { font-weight: 800; font-size: 1.1rem; }
  .feedback .msg.good { color: var(--good); }
  .feedback .msg.bad { color: var(--bad); }
  .feedback .example { color: var(--muted); }
  .feedback .example .word { font-family: "Noto Naskh Arabic", serif; font-size: 1.5rem; color: var(--ink); }
  .forms-row { display: flex; gap: 14px; font-family: "Noto Naskh Arabic", serif; font-size: 1.8rem; direction: ltr; }
  .forms-row span { display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
  .forms-row small { font-family: "Nunito", sans-serif; font-size: .65rem; color: var(--muted); }

  .summary { text-align: center; background: var(--card); border-radius: var(--radius); padding: 30px 20px; border: 3px solid #eee; }
  .summary .big { font-size: 3.5rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
  .summary .missed { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 16px 0; }
  .summary .missed div { background: #fff4f4; border: 2px solid #ffd0d0; border-radius: 12px; padding: 4px 12px; }
  .summary .missed .ar { font-family: "Noto Naskh Arabic", serif; font-size: 2rem; }
  .summary .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  u { text-decoration-thickness: 2px; text-underline-offset: 3px; }

  @media (max-width: 420px) {
    .option { font-size: 1.25rem; }
    .option.ar { font-size: 2.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Learn the Alphabet <span>أ ب ت</span></h1>
  <button id="homeBtn" class="btn secondary hidden">☰ Games</button>
</header>

<main>
  <!-- ===== Menu ===== -->
  <section id="menu" class="menu">
    <h2>Choose a game</h2>
    <div class="games">
      <button class="game-card" data-game="ar2name">
        <div class="demo"><span class="ar">ج</span> → <span class="en">djiim</span></div>
        <h3>Arabic → Name</h3>
        <p>See an Arabic letter, pick its name.</p>
      </button>
      <button class="game-card" data-game="name2ar">
        <div class="demo"><span class="en">djiim</span> → <span class="ar">ج</span></div>
        <h3>Name → Arabic</h3>
        <p>See a letter name, pick the Arabic letter.</p>
      </button>
    </div>

    <div class="settings">
      <h3>Letter forms to practise</h3>
      <div class="forms" id="formChecks">
        <label><input type="checkbox" value="isolated" checked> Isolated &nbsp;<b style="font-family:'Noto Naskh Arabic'">ب</b></label>
        <label><input type="checkbox" value="initial" checked> Beginning &nbsp;<b style="font-family:'Noto Naskh Arabic'">بـ</b></label>
        <label><input type="checkbox" value="medial" checked> Middle &nbsp;<b style="font-family:'Noto Naskh Arabic'">ـبـ</b></label>
        <label><input type="checkbox" value="final" checked> End &nbsp;<b style="font-family:'Noto Naskh Arabic'">ـب</b></label>
      </div>
      <p class="hint">Each letter is shown in a random form from the ones you select. Tip: use keys 1–4 to answer and Enter for the next letter.</p>
    </div>
  </section>

  <!-- ===== Game ===== -->
  <section id="game" class="hidden">
    <div class="topbar">
      <div class="stats">
        <span class="pill">✅ <span id="score">0</span></span>
        <span class="pill">🔥 <span id="streak">0</span></span>
      </div>
      <div class="stats"><span class="pill"><span id="count">1</span> / <span id="total">28</span></span></div>
    </div>
    <div class="progress"><div id="bar"></div></div>

    <div class="prompt-card">
      <button class="speak hidden" id="speakBtn" title="Hear the letter">🔊</button>
      <span class="form-tag" id="formTag">Beginning</span>
      <div id="prompt"></div>
      <div class="prompt-sub" id="promptSub"></div>
    </div>

    <div class="options" id="options"></div>

    <div class="feedback hidden" id="feedback">
      <div>
        <div class="msg" id="fbMsg"></div>
        <div class="example" id="fbExample"></div>
      </div>
      <div class="forms-row" id="fbForms"></div>
      <button class="btn" id="nextBtn">Next →</button>
    </div>
  </section>

  <!-- ===== Summary ===== -->
  <section id="summary" class="hidden">
    <div class="summary">
      <h2>Round complete! 🎉</h2>
      <div class="big" id="finalScore"></div>
      <div id="missedWrap">
        <p>Letters to review:</p>
        <div class="missed" id="missed"></div>
      </div>
      <div class="actions">
        <button class="btn" id="againBtn">Play again</button>
        <button class="btn secondary" id="retryMissedBtn">Practise missed letters</button>
        <button class="btn secondary" id="menuBtn">Choose another game</button>
      </div>
    </div>
  </section>
</main>

<script>
// Underlined first letter (as on the chart) marks the "heavy" letters
// that would otherwise share a name with another letter.
const LETTERS = [
  { ar: "ا", name: "alif",  word: "أناناس", meaning: "pineapple",  emoji: "🍍", group: "alif" },
  { ar: "ب", name: "baa",   word: "بيت",    meaning: "house",      emoji: "🏠", group: "b" },
  { ar: "ت", name: "taa",   word: "تفاحة",  meaning: "apple",      emoji: "🍎", group: "b" },
  { ar: "ث", name: "thaa",  word: "ثلج",    meaning: "snow",       emoji: "❄️", group: "b" },
  { ar: "ج", name: "djiim", word: "جزر",    meaning: "carrot",     emoji: "🥕", group: "j" },
  { ar: "ح", name: "<u>h</u>aa", word: "حقيبة", meaning: "bag", emoji: "🎒", group: "j" },
  { ar: "خ", name: "khaa",  word: "خبز",    meaning: "bread",      emoji: "🍞", group: "j" },
  { ar: "د", name: "daal",  word: "دراجة",  meaning: "bicycle",    emoji: "🚲", group: "d" },
  { ar: "ذ", name: "dhaal", word: "ذرة",    meaning: "corn",       emoji: "🌽", group: "d" },
  { ar: "ر", name: "raa",   word: "ريشة",   meaning: "feather",    emoji: "🪶", group: "r" },
  { ar: "ز", name: "zaay",  word: "زيتون",  meaning: "olive",      emoji: "🫒", group: "r" },
  { ar: "س", name: "siin",  word: "سفينة",  meaning: "ship",       emoji: "⛵", group: "s" },
  { ar: "ش", name: "shiin", word: "شمس",    meaning: "sun",        emoji: "☀️", group: "s" },
  { ar: "ص", name: "<u>s</u>aad", word: "صاروخ", meaning: "rocket", emoji: "🚀", group: "sad" },
  { ar: "ض", name: "<u>d</u>aad", word: "ضوء",   meaning: "light",  emoji: "💡", group: "sad" },
  { ar: "ط", name: "<u>t</u>aa",  word: "طائرة", meaning: "airplane", emoji: "✈️", group: "ta" },
  { ar: "ظ", name: "<u>dh</u>aa", word: "ظرف", meaning: "envelope", emoji: "✉️", group: "ta" },
  { ar: "ع", name: "ayn",   word: "عنب",    meaning: "grapes",     emoji: "🍇", group: "ayn" },
  { ar: "غ", name: "ghayn", word: "غيم",    meaning: "clouds",     emoji: "☁️", group: "ayn" },
  { ar: "ف", name: "faa",   word: "فراولة", meaning: "strawberry", emoji: "🍓", group: "f" },
  { ar: "ق", name: "qaaf",  word: "قلم",    meaning: "pencil",     emoji: "✏️", group: "f" },
  { ar: "ك", name: "kaaf",  word: "كرسي",   meaning: "chair",      emoji: "🪑", group: "k" },
  { ar: "ل", name: "laam",  word: "ليمون",  meaning: "lemon",      emoji: "🍋", group: "k" },
  { ar: "م", name: "miim",  word: "موز",    meaning: "banana",     emoji: "🍌", group: "m" },
  { ar: "ن", name: "noon",  word: "نجمة",   meaning: "star",       emoji: "⭐", group: "b" },
  { ar: "ه", name: "haa",   word: "هدية",   meaning: "gift",       emoji: "🎁", group: "h" },
  { ar: "و", name: "waaw",  word: "وردة",   meaning: "flower",     emoji: "🌸", group: "r" },
  { ar: "ي", name: "yaa",   word: "يقطين",  meaning: "pumpkin",    emoji: "🎃", group: "b" },
];

// Letters that never join to the following letter.
const NON_CONNECTORS = new Set(["ا", "د", "ذ", "ر", "ز", "و"]);

const ZWJ = "\u200D"; // zero-width joiner forces the contextual shape
const FORM_LABELS = { isolated: "Isolated", initial: "Beginning", medial: "Middle", final: "End" };

function shape(letter, form) {
  switch (form) {
    case "initial": return letter + ZWJ;
    case "medial":  return ZWJ + letter + ZWJ;
    case "final":   return ZWJ + letter;
    default:        return letter;
  }
}

const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- State ----------
const state = {
  game: null,
  deck: [],
  index: 0,
  score: 0,
  streak: 0,
  missed: [],
  current: null,
  answered: false,
  forms: [],
};

const $ = id => document.getElementById(id);
const show = (...ids) => ["menu", "game", "summary"].forEach(s => $(s).classList.toggle("hidden", !ids.includes(s)));

// ---------- Speech (optional) ----------
let arabicVoice = null;
function loadVoice() {
  if (!("speechSynthesis" in window)) return;
  arabicVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ar")) || null;
}
if ("speechSynthesis" in window) {
  loadVoice();
  speechSynthesis.onvoiceschanged = loadVoice;
}
function speak(text) {
  if (!arabicVoice) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = arabicVoice;
  u.lang = arabicVoice.lang;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

// ---------- Game flow ----------
function selectedForms() {
  return [...document.querySelectorAll("#formChecks input:checked")].map(i => i.value);
}

function startGame(game, letters = LETTERS) {
  state.forms = selectedForms();
  if (!state.forms.length) {
    alert("Please select at least one letter form.");
    return;
  }
  state.game = game;
  state.deck = shuffle(letters);
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.missed = [];
  $("total").textContent = state.deck.length;
  $("homeBtn").classList.remove("hidden");
  show("game");
  nextQuestion();
}

function buildOptions(correct) {
  // Mix look-alike letters (same shape group) with random ones to keep it challenging.
  const similar = shuffle(LETTERS.filter(l => l !== correct && l.group === correct.group));
  const others = shuffle(LETTERS.filter(l => l !== correct && l.group !== correct.group));
  const distractors = [...similar.slice(0, 2), ...others].slice(0, 3);
  return shuffle([correct, ...distractors]);
}

function nextQuestion() {
  if (state.index >= state.deck.length) return endGame();

  const letter = state.deck[state.index];
  const form = pick(state.forms);
  state.current = { letter, form };
  state.answered = false;

  $("count").textContent = state.index + 1;
  $("bar").style.width = (state.index / state.deck.length * 100) + "%";
  $("score").textContent = state.score;
  $("streak").textContent = state.streak;
  $("formTag").textContent = FORM_LABELS[form];
  $("feedback").classList.add("hidden");

  const prompt = $("prompt");
  const sub = $("promptSub");
  const opts = $("options");
  opts.innerHTML = "";

  if (state.game === "ar2name") {
    prompt.className = "prompt-ar";
    prompt.textContent = shape(letter.ar, form);
    sub.textContent = NON_CONNECTORS.has(letter.ar) && (form === "initial" || form === "medial")
      ? "This letter never joins to the letter after it." : "";
    $("speakBtn").classList.toggle("hidden", !arabicVoice);
  } else {
    prompt.className = "prompt-en";
    prompt.innerHTML = letter.name;
    sub.textContent = "Pick the letter in its " + FORM_LABELS[form].toLowerCase() + " form";
    $("speakBtn").classList.add("hidden");
  }

  buildOptions(letter).forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "option" + (state.game === "name2ar" ? " ar" : "");
    b.dataset.name = opt.name;
    b.innerHTML = `<span class="key">${i + 1}</span>`;
    const label = document.createElement("span");
    if (state.game === "ar2name") label.innerHTML = opt.name;
    else label.textContent = shape(opt.ar, form);
    b.appendChild(label);
    b.addEventListener("click", () => answer(b, opt));
    opts.appendChild(b);
  });
}

function answer(btn, chosen) {
  if (state.answered) return;
  state.answered = true;
  const { letter, form } = state.current;
  const correct = chosen === letter;

  document.querySelectorAll(".option").forEach(b => {
    b.disabled = true;
    if (b.dataset.name === letter.name) b.classList.add("correct");
  });

  if (correct) {
    state.score++;
    state.streak++;
    $("fbMsg").textContent = pick(["Correct! 🎉", "Great job! ⭐", "Well done! 👏", "Excellent! 🌟"]);
    $("fbMsg").className = "msg good";
  } else {
    btn.classList.add("wrong");
    state.streak = 0;
    if (!state.missed.includes(letter)) state.missed.push(letter);
    $("fbMsg").innerHTML = `Not quite — it's <b>${letter.name}</b> <span style="font-family:'Noto Naskh Arabic'">${letter.ar}</span>`;
    $("fbMsg").className = "msg bad";
  }

  $("fbExample").innerHTML =
    `${letter.emoji} <span class="word">${letter.word}</span> — ${letter.meaning}`;
  $("fbForms").innerHTML = ["isolated", "initial", "medial", "final"].map(f =>
    `<span style="${f === form ? "color:var(--accent)" : ""}">${shape(letter.ar, f)}<small>${FORM_LABELS[f]}</small></span>`
  ).join("");

  $("score").textContent = state.score;
  $("streak").textContent = state.streak;
  $("feedback").classList.remove("hidden");
  $("nextBtn").focus();
  speak(letter.ar);
}

function endGame() {
  $("bar").style.width = "100%";
  const total = state.deck.length;
  $("finalScore").textContent = `${state.score} / ${total}`;
  $("missedWrap").classList.toggle("hidden", !state.missed.length);
  $("retryMissedBtn").classList.toggle("hidden", !state.missed.length);
  $("missed").innerHTML = state.missed.map(l =>
    `<div><div class="ar">${l.ar}</div>${l.name}</div>`).join("");
  show("summary");
}

function goHome() {
  $("homeBtn").classList.add("hidden");
  show("menu");
}

// ---------- Events ----------
document.querySelectorAll(".game-card").forEach(c =>
  c.addEventListener("click", () => startGame(c.dataset.game)));
$("nextBtn").addEventListener("click", () => { state.index++; nextQuestion(); });
$("againBtn").addEventListener("click", () => startGame(state.game));
$("retryMissedBtn").addEventListener("click", () => startGame(state.game, state.missed));
$("menuBtn").addEventListener("click", goHome);
$("homeBtn").addEventListener("click", goHome);
$("speakBtn").addEventListener("click", () => speak(state.current.letter.ar));

document.addEventListener("keydown", e => {
  if ($("game").classList.contains("hidden")) return;
  if (!state.answered && /^[1-4]$/.test(e.key)) {
    const btn = document.querySelectorAll(".option")[+e.key - 1];
    if (btn) btn.click();
  } else if (state.answered && (e.key === "Enter" || e.key === " ") && e.target !== $("nextBtn")) {
    e.preventDefault();
    $("nextBtn").click();
  }
});
</script>
</body>
</html>
